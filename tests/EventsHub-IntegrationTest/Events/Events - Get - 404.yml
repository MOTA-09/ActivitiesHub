info:
  name: Events - Get - 404
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": {{$guid}},
        "title": "Future Event 3",
        "date": "2027-01-21T07:38:32.3120801",
        "description": "Event 4 months in future",
        "category": "music",
        "isCancelled": false,
        "city": "Ciudad de México",
        "venue": "Basílica de Guadalupe",
        "latitude": "19.4847",
        "longitude": "-99.1176"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 Not Found", function(){
          expect(res.getStatus()).to.equal(404);
        });

        test("Response returns an array", function(){
          
         const body = res.getBody();
          expect(body.length).to.equal("The event was not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
