info:
  name: Events - Edit - 204
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "022a7251-b5e0-453b-9a2f-95c4e1ad6d36",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "music",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 OK", function(){
          expect(res.getStatus()).to.equals(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
